services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelfarma_web_cms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=intelfarma_production_jwt_secret_token_2026_super_safe
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/data/intelfarma.sqlite
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./asserts:/app/asserts
      - ./public:/app/public
      - ./server:/app/server
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
